services:
  central:
    build: .
    container_name: central_aplicacoes
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=America/Sao_Paulo
      # Credenciais do SQL Server CHB
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-1433}
      - DB_NAME=${DB_NAME:-CHB}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASS}
    volumes:
      - /opt/pcp_dados:/opt/pcp_dados