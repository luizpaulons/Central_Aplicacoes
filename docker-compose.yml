services:
  central:
    build: .
    container_name: central_aplicacoes
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=America/Sao_Paulo
      # Credenciais do SQL Server CHB
      - DB_HOST=SEU_IP_OU_HOST
      - DB_PORT=1433
      - DB_NAME=CHB
      - DB_USER=SEU_USUARIO
      - DB_PASSWORD=SUA_SENHA
    volumes:
      - /opt/pcp_dados:/opt/pcp_dados