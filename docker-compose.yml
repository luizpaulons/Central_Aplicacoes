version: '3.8'

services:
  central:
    build: .
    container_name: central_aplicacoes
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=America/Sao_Paulo
    volumes:
      # Persistência do banco SQLite: pasta física na VPS : pasta interna do container
      - /opt/pcp_dados:/opt/pcp_dados
