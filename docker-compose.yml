version: '3.8'

services:
  central:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: central_aplicacoes
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      # Mantém os dados da aplicação sincronizados com o servidor
      - .:/app
    environment:
      - TZ=America/Sao_Paulo